<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Retro Arcade — DOS player</title>
<link rel="stylesheet" href="/retro/jsdos/js-dos.css" />
<style>
  @font-face {
    font-family: "Baloo";
    src: url("/fonts/baloo2.woff2") format("woff2");
    font-weight: 400 800;
    font-display: swap;
  }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070a; }
  body { overflow: hidden; font-family: "Baloo", ui-rounded, "Segoe UI", system-ui, sans-serif; }

  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* The CRT: a dark bezel with a phosphor screen. The emulator is clipped inside
     it, so the rounded corners are the frame's, not the canvas's. */
  #screen {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    margin: 10px;
    border-radius: 14px;
    overflow: hidden;
    background: #0a0d12;
    box-shadow: 0 0 0 2px #1b2029, 0 18px 40px -24px #000 inset;
  }
  #dos { position: absolute; inset: 0; }

  /* js-dos paints its own chrome (sidebar, toasts, error windows). It stays:
     it is the player's own control surface, and re-skinning another project's
     shadow DOM without a browser to test in is how a working emulator ends up
     looking broken. Only the root surface colour is aligned with ours. */
  .jsdos-rso { background: #0a0d12 !important; }
  .jsdos-rso canvas { image-rendering: pixelated; }

  #boot {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 20px; text-align: center;
    background: #0a0d12; color: #c8d3e4;
    transition: opacity .25s ease;
  }
  #boot[hidden] { display: none; }
  #boot .title { font-size: 15px; font-weight: 800; color: #f4f0e6; letter-spacing: .01em; }
  #boot .line { font-size: 12.5px; color: #97a3b6; max-width: 46ch; line-height: 1.5; }
  #boot .bar { width: 132px; height: 3px; border-radius: 2px; background: #1e2530; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 38%; background: #f2c14e; animation: slide 1.1s ease-in-out infinite; }
  #boot.error .bar { display: none; }
  #boot.error .title { color: #ffb4a8; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
</style>
</head>
<body>
<div id="shell">
  <div id="screen">
    <div id="dos"></div>
    <div id="boot">
      <p class="title" id="boot-title">Starting DOS…</p>
      <p class="line" id="boot-line">Loading the emulator the first time takes a few seconds.</p>
      <div class="bar"><i></i></div>
    </div>
  </div>
</div>
<script>
/**
 * The DOS player document.
 *
 * Same contract as `/retro/player.html` (the GBA one), for the same reasons:
 *
 *   · it is a **separate document**, so a 2 MB emulator bundle and its globals
 *     never touch the app's React tree;
 *   · it accepts **only an https URL or a /retro/ path** and checks the host
 *     again before booting, so a hand-written postMessage cannot point the
 *     emulator at an arbitrary file;
 *   · it reports what is happening over one channel, and shows a real reason
 *     when something fails — a black screen is not a state.
 *
 * Two things are specific to DOS. js-dos is a classic script that installs
 * `window.Dos`, and it fetches its own cores relative to `pathPrefix` — both are
 * vendored under `/retro/jsdos/` (see VENDOR.md there). And a `.jsdos` bundle is
 * a ZIP that js-dos reads; this page never unpacks it, never inspects its
 * contents beyond the pre-flight fetch, and never runs anything itself.
 */
(function () {
  "use strict";

  var CHANNEL = "pikachu-retro";
  var params = new URLSearchParams(location.search);
  var bootEl = document.getElementById("boot");
  var bootTitle = document.getElementById("boot-title");
  var bootLine = document.getElementById("boot-line");
  var host = document.getElementById("dos");

  var started = false;
  var startedAt = 0;
  var poller = 0;
  var watchdog = 0;
  var api = null;

  function post(message) {
    if (window.parent === window) return;
    try { window.parent.postMessage(Object.assign({ channel: CHANNEL }, message), location.origin); } catch (e) {}
  }

  function setText(title, line) {
    bootTitle.textContent = title;
    if (typeof line === "string") bootLine.textContent = line;
  }

  function fail(reason, line) {
    bootEl.hidden = false;
    bootEl.classList.add("error");
    setText(reason, line);
    post({ type: "error", message: reason });
  }

  /**
   * The only URLs this page will boot: a path inside our own `/retro/` tree, or an
   * absolute https URL (an admin-approved bundle in storage). Everything else —
   * a data: URL, a protocol-relative host, a local file — is refused rather than
   * handed to an emulator.
   */
  function safeUrl(value) {
    if (typeof value !== "string") return null;
    var url = value.trim();
    if (/^\/retro\/[A-Za-z0-9._\-\/]+\.jsdos$/.test(url)) return url;
    if (/^https:\/\/[^\s"'<>]+\.jsdos$/i.test(url)) return url;
    return null;
  }

  /** Ask the server for the bundle before booting, so a 404 is a sentence. */
  function preflight(url) {
    return fetch(url, { method: "GET", headers: { range: "bytes=0-0" }, cache: "force-cache" })
      .then(function (res) {
        if (res.ok || res.status === 206) return true;
        if (res.status === 404) throw new Error("missing");
        if (res.status === 403) throw new Error("forbidden");
        throw new Error("http-" + res.status);
      });
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement("script");
      script.src = src;
      script.async = false;
      script.onload = resolve;
      script.onerror = function () { reject(new Error("script")); };
      document.head.appendChild(script);
    });
  }

  function boot(game) {
    if (started) return;
    started = true;
    startedAt = Date.now();
    setText("Starting " + (game.name || "DOS") + "…", "The first launch fetches the emulator core; after that it is cached.");

    preflight(game.url)
      .catch(function (error) {
        var why = error && error.message;
        if (why === "missing") {
          fail("That game file is not on the server.", "The bundle this entry points at answered 404, so there is nothing to boot.");
        } else if (why === "forbidden") {
          fail("The storage bucket refused that file.", "Check the bucket policy: a published bundle has to be readable by anyone.");
        } else {
          fail("The game file could not be fetched.", "The network or the host refused the request (" + why + ").");
        }
        post({ type: "status", status: "error" });
        throw error;
      })
      .then(function () {
        if (window.Dos) return;
        return loadScript("/retro/jsdos/js-dos.js").catch(function () {
          fail("The emulator did not load.", "js-dos could not be fetched from this site. Reload, and check the browser console for a 404 under /retro/jsdos/.");
          post({ type: "status", status: "error" });
          throw new Error("jsdos-script");
        });
      })
      .then(function () {
        if (!window.Dos) throw new Error("jsdos-missing");

        /* js-dos reads `pathPrefix` for its cores and `backend: "dosbox"` for the
           small wdosbox core — the one vendored here. The DOSBox-X cores are
           deliberately not shipped (7–8 MB each) and would 404. */
        api = window.Dos(host, {
          url: game.url,
          pathPrefix: "/retro/jsdos/",
          backend: "dosbox",
          onExit: undefined
        });

        post({ type: "status", status: "loading" });

        /* js-dos has no "ready" callback in its public API: it draws its canvas
           when the machine starts. Watching for that canvas is the least
           invasive signal that a bundle actually booted, and it is what turns a
           silent black screen into a timeout with an explanation. */
        poller = window.setInterval(function () {
          var canvas = host.querySelector("canvas");
          if (canvas && canvas.width > 0 && canvas.height > 0) {
            window.clearInterval(poller);
            window.clearInterval(watchdog);
            bootEl.style.opacity = "0";
            window.setTimeout(function () { bootEl.hidden = true; }, 260);
            post({ type: "status", status: "running" });
            post({ type: "ready" });
          }
        }, 200);

        watchdog = window.setTimeout(function () {
          if (host.querySelector("canvas")) return;
          window.clearInterval(poller);
          fail(
            "DOS started, but no screen appeared.",
            "This bundle may be malformed, or its [autoexec] may never start a program. The desk can validate the archive before publishing it.",
          );
          post({ type: "status", status: "error" });
        }, 25000);
      })
      .catch(function (error) {
        /* Already reported; this keeps the console honest without a second alarm. */
        if (error && /jsdos|script|missing|forbidden|http-/.test(String(error.message))) return;
        fail("The player could not start.", String((error && error.message) || error));
        post({ type: "status", status: "error" });
      });
  }

  function command(msg) {
    if (!api) return;
    switch (msg.cmd) {
      case "pause": if (typeof api.setPaused === "function") api.setPaused(true); break;
      case "resume": if (typeof api.setPaused === "function") api.setPaused(false); break;
      case "fullscreen": if (typeof api.setSoftFullscreen === "function") api.setSoftFullscreen(true); break;
      case "mute":
        if (typeof api.setVolume === "function") api.setVolume(msg.value ? 0 : 1);
        break;
      case "stop":
        if (typeof api.stop === "function") { try { api.stop(); } catch (e) {} }
        break;
    }
  }

  window.addEventListener("message", function (event) {
    if (event.origin !== location.origin) return;
    var data = event.data;
    if (!data || data.channel !== CHANNEL) return;

    if (data.type === "boot") {
      var payload = data.game || {};
      var url = safeUrl(payload.url);
      if (!url) {
        fail("No game file was provided.", "The player was asked to boot something it will not load.");
        return;
      }
      boot({ url: url, name: typeof payload.name === "string" ? payload.name.slice(0, 80) : "DOS" });
      return;
    }
    if (data.type === "cmd") command(data);
  });

  /* Standalone mode: /retro/dos.html?game=<id> — used by the smoke script and by
     anyone who opens the page directly. It resolves the id against the committed
     shelf, with the same rules the app applies. */
  var standalone = params.get("game");
  if (standalone) {
    fetch("/retro/dos/shelf.json", { headers: { accept: "application/json" } })
      .then(function (res) { return res.json(); })
      .then(function (shelf) {
        var games = (shelf && Array.isArray(shelf.games)) ? shelf.games : [];
        var game = null;
        for (var i = 0; i < games.length; i += 1) if (games[i] && games[i].id === standalone) { game = games[i]; break; }
        if (!game) throw new Error("unknown-game");
        var bundle = typeof game.bundle === "string"
          ? (game.bundle.indexOf("https://") === 0 ? game.bundle : "/retro/dos/" + game.bundle)
          : null;
        if (!safeUrl(bundle)) throw new Error("bad-bundle");
        boot({ url: bundle, name: String(game.title || "DOS") });
      })
      .catch(function () {
        fail("That game is not in the DOS library.", "The id in the address does not match anything on the shelf.");
      });
  } else {
    setText("Waiting for the library…", "This page is loaded inside the DOS player.");
  }
})();
</script>
</body>
</html>
