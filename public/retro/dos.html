<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Retro Arcade — DOS player</title>
<link rel="stylesheet" href="/retro/jsdos/js-dos.css" />
<style>
  @font-face {
    font-family: "Baloo";
    src: url("/fonts/baloo2.woff2") format("woff2");
    font-weight: 400 800;
    font-display: swap;
  }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070a; }
  body { overflow: hidden; font-family: "Baloo", ui-rounded, "Segoe UI", system-ui, sans-serif; }

  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* The CRT: a dark bezel with a phosphor screen. The emulator is clipped inside
     it, so the rounded corners are the frame's, not the canvas's. */
  #screen {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    margin: 10px;
    border-radius: 14px;
    overflow: hidden;
    background: #0a0d12;
    box-shadow: 0 0 0 2px #1b2029, 0 18px 40px -24px #000 inset;
  }
  #dos { position: absolute; inset: 0; overflow: hidden; }

  /* js-dos is a whole app: sidebar, toasts, error windows, its own theme. The
     player runs it in kiosk mode so there is no sidebar, but the app still
     paints whatever colour its theme says — so the root surface is aligned with
     the monitor here, and the canvas is centred and never stretched. */
  .jsdos-rso { background: #0a0d12 !important; }
  .jsdos-rso > div { background: #0a0d12 !important; }
  .jsdos-rso canvas {
    image-rendering: pixelated;
    display: block;
    margin: 0 auto;
    max-width: 100%;
    max-height: 100%;
  }

  /* The canvas is exactly the game's video mode — 320x200 for most of these,
     640x480 for the later ones — and it is stretched to fill the 4:3 bezel.
     That is not a distortion: a 320x200 VGA frame was drawn for a 4:3 monitor,
     so the "tall" pixels ARE the picture, and a 1.6:1 letterbox would be the
     incorrect shape. js-dos writes its own pixel size onto the element, so this
     has to be !important; the two lines are the only override in the file. */
  #dos .jsdos-rso canvas,
  #dos canvas {
    width: 100% !important;
    height: 100% !important;
    top: 0 !important;
    left: 0 !important;
    position: absolute !important;
  }

  /* The boot card. It covers the emulator only while there is nothing to see,
     and it is a card rather than a full black slab so the screen behind it reads
     as "warming up", not "broken". */
  #boot {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
    background: radial-gradient(circle at 50% 40%, #121923 0%, #080b10 70%);
    transition: opacity .25s ease;
  }
  #boot[hidden] { display: none; }
  #boot .card {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    max-width: min(92%, 44ch);
    padding: 18px 20px 16px;
    border-radius: 12px;
    border: 1px solid #232b37;
    background: rgba(14, 18, 24, .92);
    box-shadow: 0 18px 40px -26px #000;
  }
  #boot .title { font-size: 14.5px; font-weight: 800; color: #f4f0e6; letter-spacing: .01em; }
  #boot .line { font-size: 12.5px; color: #8e9aad; max-width: 44ch; line-height: 1.55; }
  #boot .bar { width: 140px; height: 3px; border-radius: 2px; background: #1b2129; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 38%; background: #f2c14e; animation: slide 1.1s ease-in-out infinite; }
  #boot.error .bar { display: none; }
  #boot.error .title { color: #ffb4a8; }
  #boot.error .card { border-color: #5a2a2f; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
  @media (prefers-reduced-motion: reduce) {
    #boot .bar i { animation: none; width: 100%; opacity: .5; }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="screen">
    <div id="dos"></div>
    <div id="boot">
      <div class="card">
        <p class="title" id="boot-title">Starting DOS…</p>
        <p class="line" id="boot-line">Loading the emulator the first time takes a few seconds.</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </div>
</div>
<script>
/**
 * The DOS player document.
 *
 * Same contract as `/retro/player.html` (the GBA one), for the same reasons:
 *
 *   · it is a **separate document**, so a 2 MB emulator bundle and its globals
 *     never touch the app's React tree;
 *   · it accepts **only an https URL or a /retro/ path** and checks the host
 *     again before booting, so a hand-written postMessage cannot point the
 *     emulator at an arbitrary file;
 *   · it reports what is happening over one channel, and shows a real reason
 *     when something fails — a black screen is not a state.
 *
 * Two things are specific to DOS. js-dos is a classic script that installs
 * `window.Dos`, and it fetches its own cores relative to `pathPrefix` — both are
 * vendored under `/retro/jsdos/` (see VENDOR.md there). And a `.jsdos` bundle is
 * a ZIP that js-dos reads; this page never unpacks it, never inspects its
 * contents beyond the pre-flight fetch, and never runs anything itself.
 *
 * `pathPrefix` must end in `emulators/`. js-dos loads `pathPrefix + "emulators.js"`
 * and then `pathPrefix + "wdosbox.js"`, so a prefix of `/retro/jsdos/` asks the
 * server for `/retro/jsdos/emulators.js`, which does not exist. That 404 is
 * silent inside js-dos — it logs to the console, keeps its own loading screen and
 * never creates a canvas — which is exactly the failure this page used to report
 * as "DOS started, but no screen appeared". The prefix is one constant now, and
 * `npm run smoke:dos` fetches the core files through it.
 */
(function () {
  "use strict";

  var CHANNEL = "pikachu-retro";
  var params = new URLSearchParams(location.search);
  var bootEl = document.getElementById("boot");
  var bootTitle = document.getElementById("boot-title");
  var bootLine = document.getElementById("boot-line");
  var host = document.getElementById("dos");

  /* Where the vendored js-dos cores live. js-dos appends the file names itself,
     so this has to point at the directory holding emulators.js and wdosbox.*. */
  var EMULATOR_PREFIX = "/retro/jsdos/emulators/";

  /* js-dos calls `navigator.keyboard.lock()` when it starts. Browsers only allow
     that from a primary top-level document, so inside this frame the promise
     rejects — and js-dos does not catch it, which puts an "InvalidStateError"
     in the console that belongs to neither this page nor the game. It is
     harmless (this frame still receives keys once it has focus, which `ready()`
     arranges), but a visitor reading the console should not be handed a red
     error by the player. Only that one rejection is silenced. */
  window.addEventListener("unhandledrejection", function (event) {
    var reason = event && event.reason;
    var text = String((reason && reason.message) || reason || "");
    if (/lock.*Keyboard|Keyboard.*lock|keyboard.*lock/i.test(text)) event.preventDefault();
  });

  var started = false;
  var startedAt = 0;
  var running = false;
  var poller = 0;
  var watchdog = 0;
  var nudge = 0;
  var api = null;

  function post(message) {
    if (window.parent === window) return;
    try { window.parent.postMessage(Object.assign({ channel: CHANNEL }, message), location.origin); } catch (e) {}
  }

  function setText(title, line) {
    bootTitle.textContent = title;
    if (typeof line === "string") bootLine.textContent = line;
  }

  function fail(reason, line) {
    bootEl.hidden = false;
    bootEl.classList.remove("error-hide");
    bootEl.classList.add("error");
    setText(reason, line);
    post({ type: "error", message: reason, detail: line });
    post({ type: "status", status: "error" });
  }

  /**
   * The only URLs this page will boot: a path inside our own `/retro/` tree, or an
   * absolute https URL (an admin-approved bundle in storage). Everything else —
   * a data: URL, a protocol-relative host, a local file — is refused rather than
   * handed to an emulator.
   */
  function safeUrl(value) {
    if (typeof value !== "string") return null;
    var url = value.trim();
    if (/^\/retro\/[A-Za-z0-9._\-\/]+\.jsdos$/.test(url)) return url;
    if (/^https:\/\/[^\s"'<>]+\.jsdos$/i.test(url)) return url;
    return null;
  }

  /** Ask the server for the bundle before booting, so a 404 is a sentence. */
  function preflight(url) {
    return fetch(url, { method: "GET", headers: { range: "bytes=0-0" }, cache: "force-cache" })
      .then(function (res) {
        if (res.ok || res.status === 206) return true;
        if (res.status === 404) throw new Error("missing");
        if (res.status === 403) throw new Error("forbidden");
        throw new Error("http-" + res.status);
      });
  }

  /**
   * Check the emulator's own files before asking js-dos to boot. A missing core
   * used to surface 25 seconds later as "no screen appeared", which blames the
   * game for the site's own 404; naming the file is honest and faster.
   */
  function preflightCore() {
    /* A wrong path does not always answer 404. A dev server (and some static
       hosts) will answer *any* missing path with the app's index.html and a 200,
       so "the request succeeded" is not the same as "the file is there". Each
       core file is therefore checked for what it is: JavaScript that is not an
       HTML document, and a wasm module that starts with the wasm magic. */
    var files = [
      { name: "emulators.js", kind: "js" },
      { name: "wdosbox.js", kind: "js" },
      { name: "wdosbox.wasm", kind: "wasm" },
      /* js-dos mounts a .jsdos archive through libzip, so this is on the boot
         path too — the one file whose absence looked like a game that would not
         start. It is 73 KB and cached with the rest. */
      { name: "wlibzip.js", kind: "js" },
      { name: "wlibzip.wasm", kind: "wasm" }
    ];

    function verify(name, kind, res) {
      if (!res.ok && res.status !== 206) throw new Error("core:" + name + ":" + res.status);

      if (kind === "wasm") {
        var type = res.headers.get("content-type") || "";
        if (/application\/wasm/i.test(type)) return true;
        /* No wasm MIME type: read the magic number instead of trusting the URL. */
        return res.arrayBuffer().then(function (buffer) {
          var head = new Uint8Array(buffer.slice(0, 4));
          if (head.length < 4 || head[0] !== 0 || head[1] !== 0x61 || head[2] !== 0x73 || head[3] !== 0x6d) {
            throw new Error("core:" + name + ":not-wasm");
          }
          return true;
        });
      }

      return res.text().then(function (body) {
        var head = body.slice(0, 200).trim().toLowerCase();
        if (!head || head.indexOf("<!doctype") === 0 || head.indexOf("<html") === 0) {
          throw new Error("core:" + name + ":html");
        }
        if (name === "emulators.js" && body.indexOf("pathPrefix") === -1) {
          throw new Error("core:" + name + ":wrong-file");
        }
        return true;
      });
    }

    return Promise.all(files.map(function (file) {
      return fetch(EMULATOR_PREFIX + file.name, { cache: "force-cache" })
        .then(function (res) { return verify(file.name, file.kind, res); })
        .catch(function (error) {
          throw (/^core:/.test(String(error && error.message)) ? error : new Error("core:" + file.name + ":network"));
        });
    }));
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement("script");
      script.src = src;
      script.async = false;
      script.onload = resolve;
      script.onerror = function () { reject(new Error("script")); };
      document.head.appendChild(script);
    });
  }

  function boot(game) {
    if (started) return;
    started = true;
    startedAt = Date.now();
    setText("Starting " + (game.name || "DOS") + "…", "The first launch fetches the emulator core; after that it is cached.");

    preflight(game.url)
      .catch(function (error) {
        var why = error && error.message;
        if (why === "missing") {
          fail("That game file is not on the server.", "The bundle this entry points at answered 404, so there is nothing to boot.");
        } else if (why === "forbidden") {
          fail("The storage bucket refused that file.", "Check the bucket policy: a published bundle has to be readable by anyone.");
        } else {
          fail("The game file could not be fetched.", "The network or the host refused the request (" + why + ").");
        }
        throw error;
      })
      .then(function () {
        return preflightCore().catch(function (error) {
          var parts = String((error && error.message) || error).split(":");
          var why = parts[2] === "html"
            ? "the server answered with an HTML page instead of the file"
            : parts[2] === "not-wasm"
              ? "that file is not a WebAssembly module"
              : parts[2] === "wrong-file"
                ? "the file it returned is not the emulator loader"
                : "the request failed (" + (parts[2] || "network") + ")";
          fail(
            "The emulator's own files are missing.",
            "This page asked for " + EMULATOR_PREFIX + parts[1] + " and " + why +
              ". That is a problem with the site, not the game; the bundle has not been blamed for it.",
          );
          throw new Error("core-missing");
        });
      })
      .then(function () {
        if (window.Dos) return;
        return loadScript("/retro/jsdos/js-dos.js").catch(function () {
          fail("The emulator did not load.", "js-dos could not be fetched from this site. Reload, and check the browser console for a 404 under /retro/jsdos/.");
          throw new Error("jsdos-script");
        });
      })
      .then(function () {
        if (!window.Dos) throw new Error("jsdos-missing");

        /* js-dos reads `pathPrefix` for its cores and `backend: "dosbox"` for the
           small wdosbox core — the one vendored here. The DOSBox-X cores are
           deliberately not shipped (7–8 MB each) and would 404. */
        /* `autoStart` is the option that matters most here, and leaving it out
           is what produced "DOS started, but no screen appeared". js-dos loads
           the bundle, then parks on its own pre-run screen — a Play button and
           no canvas at all — unless autoStart is true, in which case `bndReady`
           dispatches `bndPlay` and the run window (the one that owns the
           <canvas>) mounts by itself. `countDownStart: 0` keeps autoStart
           immediate rather than counting down. */
        api = window.Dos(host, {
          url: game.url,
          pathPrefix: EMULATOR_PREFIX,
          backend: "dosbox",
          autoStart: true,
          countDownStart: 0,
          /* Kiosk hides js-dos's own sidebar and start screen: this desk already
             has a monitor, a title and its own controls, and a second set of
             chrome inside the bezel read as a white stripe down the left edge. */
          kiosk: true,
          theme: "dark",
          autoSave: false,
          onEvent: function (event) {
            /* "ci-ready" fires once the emulator instance exists — the moment
               the canvas is mounted and DOS is booting. It is a better signal
               than polling for a canvas, so it is used when it arrives. */
            if (event === "ci-ready") ready("ci-ready");
          }
        });

        post({ type: "status", status: "loading" });

        /* js-dos has no "ready" callback in its public API: it draws its canvas
           when the machine starts. Watching for that canvas is the least
           invasive signal that a bundle actually booted, and it is what turns a
           silent black screen into a timeout with an explanation. */
        watch();
      })
      .catch(function (error) {
        /* Already reported; this keeps the console honest without a second alarm. */
        if (error && /jsdos|script|missing|forbidden|http-|core-/.test(String(error.message))) return;
        fail("The player could not start.", String((error && error.message) || error));
        post({ type: "status", status: "error" });
      });
  }

  /**
   * The emulator is up: drop the boot card and tell the desk page.
   *
   * Called from three places, because js-dos can reach this state by three
   * routes and none of them is guaranteed across versions: its own `ci-ready`
   * event, a <canvas> appearing in the host, and (as a last resort) pressing the
   * Play button on the pre-run screen if autoStart did not take.
   */
  function ready(via) {
    if (running) return;
    running = true;
    window.clearInterval(poller);
    window.clearTimeout(watchdog);
    window.clearTimeout(nudge);
    bootEl.style.opacity = "0";
    window.setTimeout(function () { bootEl.hidden = true; }, 260);
    post({ type: "status", status: "running" });
    post({ type: "ready" });
    /* A DOS program reads the keyboard directly, and a document that has never
       been focused swallows the first keypress. Taking focus here is what makes
       arrow keys move on the first press instead of the second. */
    try { window.focus(); } catch (e) {}
    if (via) console.log("[pikachu] DOS running via", via);
  }

  /**
   * Whatever js-dos has written on its own screen, loosely, for a failure.
   * `textContent` is the fallback for engines without `innerText` (jsdom in the
   * tests, and a couple of embedded webviews); it is coarser but never throws.
   */
  function emulatorSays() {
    var text = String(host.innerText || host.textContent || "").replace(/\s+/g, " ").trim();
    return text ? text.slice(0, 180) : "";
  }

  /**
   * Watch for the three things that can happen after `Dos()` returns:
   *
   *   · a canvas appears → the machine is running;
   *   · a `.pre-run-window` appears → js-dos is waiting for a click, which is a
   *     state we refuse to leave a visitor in: click its Play button for them;
   *   · neither, within 45 s → report the failure with whatever js-dos printed.
   *
   * 45 s is generous on purpose: a cold launch downloads a 1.4 MB core and then
   * unpacks an 8 MB bundle inside WebAssembly, which is slow on a small machine.
   */
  function watch() {
    var nudged = false;

    function check() {
      if (running) return;

      var canvas = host.querySelector("canvas");
      if (canvas && canvas.width > 0 && canvas.height > 0) {
        ready("canvas");
        return;
      }

      var preRun = host.querySelector(".pre-run-window");
      if (preRun && !nudged) {
        var play = preRun.querySelector("button");
        if (play) {
          nudged = true;
          setText("Starting DOS…", "The bundle is loaded; pressing go on the emulator's own screen.");
          try { play.click(); } catch (e) {}
        }
      }

      /* js-dos swaps in an error window when it fails; if one is on screen, say
         so now rather than waiting out the timeout. */
      if (host.querySelector(".window") && /error|unable|failed|not avalible/i.test(emulatorSays())) {
        window.clearInterval(poller);
        window.clearTimeout(watchdog);
        fail("The emulator reported a problem.", emulatorSays() || "js-dos stopped before drawing a screen.");
      }
    }

    poller = window.setInterval(check, 200);

    /* The bundle download and the unpack are the long, silent part. Say so,
       rather than letting a black rectangle look like nothing happening. */
    nudge = window.setTimeout(function () {
      if (!running) setText("Unpacking the bundle…", "The emulator core is loaded; the game is being extracted and mounted as C:.");
    }, 6000);

    watchdog = window.setTimeout(function () {
      if (running) return;
      window.clearInterval(poller);
      var said = emulatorSays();
      fail(
        "The emulator never started.",
        said
          ? "js-dos says: “" + said + "”"
          : "js-dos loaded but produced no screen and no message. Open the browser console: the fault is in the player, not in the game archive.",
      );
    }, 45000);
  }

  /* ------------------------------------------------------------ the keyboard
     The desk page has an on-screen gamepad for phones (and for anyone without a
     keyboard in front of them). It cannot dispatch an event into this document
     itself — the pad lives in the parent frame — so it posts `{type:'cmd',
     cmd:'key'}` and this function turns that into a real KeyboardEvent on the
     element js-dos listens on.

     A DOS program does not read "the page": it polls the keyboard through the
     browser's event queue, so the event has to exist, bubble, and carry the
     legacy `keyCode`/`which` fields DOSBox uses to identify a key. Synthetic
     events are indistinguishable from real ones here (nothing in this path asks
     `isTrusted`), which is exactly why the pad can work at all. */
  var KEY_TARGETS = [".jsdos-rso canvas", "#jsdos canvas", "canvas"];

  function keyTarget() {
    var node = null;
    for (var i = 0; i < KEY_TARGETS.length && !node; i += 1) {
      node = host.querySelector(KEY_TARGETS[i]);
    }
    return node || host;
  }

  function keyEvent(type, spec) {
    var code = typeof spec.keyCode === "number" ? spec.keyCode : 0;
    var event;
    try {
      event = new KeyboardEvent(type, {
        key: String(spec.key),
        code: typeof spec.code === "string" ? spec.code : "",
        keyCode: code,
        which: code,
        bubbles: true,
        cancelable: true,
        composed: true
      });
    } catch (error) {
      event = document.createEvent("Event");
      event.initEvent(type, true, true);
    }
    /* Chrome honours keyCode in the init dictionary, older engines do not; the
       own property shadows the prototype getter when the constructor ignored it. */
    if (event.keyCode !== code) {
      try {
        Object.defineProperty(event, "keyCode", { get: function () { return code; } });
        Object.defineProperty(event, "which", { get: function () { return code; } });
      } catch (error) {}
    }
    return event;
  }

  function sendKey(msg) {
    var spec = msg.value;
    if (!spec || typeof spec.key !== "string" || !spec.key) return;
    var target = keyTarget();
    try { if (target.focus) target.focus({ preventScroll: true }); } catch (error) {}
    var down = msg.action !== "up";
    try {
      target.dispatchEvent(keyEvent(down ? "keydown" : "keyup", spec));
    } catch (error) { /* a dead machine ignores keys; that is not an error */ }
    if (msg.action === "tap") {
      window.setTimeout(function () {
        try { target.dispatchEvent(keyEvent("keyup", spec)); } catch (error) {}
      }, 60);
    }
  }

  function command(msg) {
    /* Keys matter only once there is a machine to receive them: before that the
       only canvas in here is js-dos's own boot screen. */
    if (msg.cmd === "key") { if (api) sendKey(msg); return; }
    if (!api) return;
    switch (msg.cmd) {
      case "pause": if (typeof api.setPaused === "function") api.setPaused(true); break;
      case "resume": if (typeof api.setPaused === "function") api.setPaused(false); break;
      case "fullscreen": if (typeof api.setSoftFullscreen === "function") api.setSoftFullscreen(true); break;
      case "mute":
        if (typeof api.setVolume === "function") api.setVolume(msg.value ? 0 : 1);
        break;
      case "stop":
        if (typeof api.stop === "function") { try { api.stop(); } catch (e) {} }
        break;
    }
  }

  window.addEventListener("message", function (event) {
    if (event.origin !== location.origin) return;
    var data = event.data;
    if (!data || data.channel !== CHANNEL) return;

    if (data.type === "boot") {
      var payload = data.game || {};
      var url = safeUrl(payload.url);
      if (!url) {
        fail("No game file was provided.", "The player was asked to boot something it will not load.");
        return;
      }
      boot({ url: url, name: typeof payload.name === "string" ? payload.name.slice(0, 80) : "DOS" });
      return;
    }
    if (data.type === "cmd") command(data);
  });

  /* Standalone mode: /retro/dos.html?game=<id> — used by the smoke script and by
     anyone who opens the page directly. It resolves the id against the committed
     shelf, with the same rules the app applies. */
  var standalone = params.get("game");
  if (standalone) {
    fetch("/retro/dos/shelf.json", { headers: { accept: "application/json" } })
      .then(function (res) { return res.json(); })
      .then(function (shelf) {
        var games = (shelf && Array.isArray(shelf.games)) ? shelf.games : [];
        var game = null;
        for (var i = 0; i < games.length; i += 1) if (games[i] && games[i].id === standalone) { game = games[i]; break; }
        if (!game) throw new Error("unknown-game");
        var bundle = typeof game.bundle === "string"
          ? (game.bundle.indexOf("https://") === 0 ? game.bundle : "/retro/dos/" + game.bundle)
          : null;
        if (!safeUrl(bundle)) throw new Error("bad-bundle");
        boot({ url: bundle, name: String(game.title || "DOS") });
      })
      .catch(function () {
        fail("That game is not in the DOS library.", "The id in the address does not match anything on the shelf.");
      });
  } else {
    setText("Waiting for the library…", "This page is loaded inside the DOS player.");
  }
})();
</script>
</body>
</html>
