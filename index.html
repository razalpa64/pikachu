        <h1 style="font-size:1.7rem;margin:0 0 .5rem">Pikachu Arcade — an arcade for two</h1>
        <p style="margin:0 0 1.1rem">
          26 free browser games for one or two people: board games, card games, puzzles,

          <li><a href="/solo/chess-arena">Chess Arena</a> — Slow games, long evenings</li>
          <li><a href="/solo/tic-tac-toe-duel">Tic-Tac-Toe Duel</a> — Best of three, loser makes tea</li>

          <li><a href="/solo/dots-and-boxes">Dots &amp; Boxes</a> — Close the box and keep the turn</li>
          <li><a href="/solo/mancala">Mancala</a> — Sow the seeds, steal the store</li>
          <li><a href="/solo/snake-arena">Snake Arena</a> — One more go, promise</li>
          <li><a href="/solo/puzzle-quest">Puzzle Quest</a> — Five little brain teasers</li>

        </ul>
        <h2 style="font-size:1.15rem;margin:1.4rem 0 .5rem">How a match works</h2>
        <p style="margin:0 0 1.1rem">
          One player opens a room and sends the five-letter code to the other. The relay server referees
          every move, so the board survives a dropped connection — reopen the link and the game is exactly
          where you left it. Every game also runs solo against an AI opponent.
        </p>
